
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Linktree</title>

    
    <script src="https://cdn.tailwindcss.com"></script>

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="min-h-screen flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md text-center">

            
            <div class="relative inline-block mb-4">
                <div class="profile-glow"></div>

                <img
                    src="foto perfil.jpg"
                    alt="Foto de perfil"
                    class="relative w-28 h-28 rounded-full object-cover border-4 border-purple-400 shadow-xl"
                >
            </div>

            
            <h1 class="text-2xl font-bold text-white">
                Giih Oliver
            </h1>

            <p class="text-gray-300 mt-2">
                ✨ Criatividade, tecnologia e muito estilo
            </p>

            <p class="text-gray-400 text-sm mt-1 mb-7">
                Bem-vindo ao meu cantinho da internet 💜
            </p>


            
            <div class="space-y-4">

                <a href="#" class="link-card">
                    <span>🌐</span>
                    <span>Meu Site</span>
                </a>

                <a href="#" class="link-card">
                    <span>📸</span>
                    <span>Instagram</span>
                </a>

                <a href="#" class="link-card">
                    <span>🎵</span>
                    <span>TikTok</span>
                </a>

                <a href="#" class="link-card">
                    <span>💻</span>
                    <span>GitHub</span>
                </a>

                <a href="#" class="link-card">
                    <span>💼</span>
                    <span>LinkedIn</span>
                </a>

                <a href="#" class="link-card">
                    <span>💬</span>
                    <span>Fale comigo no WhatsApp</span>
                </a>

            </div>

            <div class="flex justify-center gap-5 mt-8">

                <a href="#" class="social">
                    Instagram
                </a>

                <a href="#" class="social">
                    TikTok
                </a>

                <a href="#" class="social">
                    GitHub
                </a>

            </div>


            <!-- Rodapé -->
            <p class="text-gray-500 text-xs mt-8">
                © 2026 • Todos os direitos reservados
            </p>

        </div>

    </main>

</body>
</html>
